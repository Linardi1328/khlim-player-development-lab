name: Validate player lab

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: player-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab_ci_only
          POSTGRES_DB: khlim_player_lab_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U lab -d khlim_player_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://lab:lab_ci_only@127.0.0.1:5432/khlim_player_lab_test?schema=public
      APP_URL: http://127.0.0.1:3000
      AUTH_PROVIDER: lab
      LAB_RESET_SECRET: ci-only-synthetic-player-lab-reset-secret
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate && pnpm db:validate && pnpm db:migrate && pnpm db:seed && pnpm db:status
      - run: pnpm lint && pnpm format:check && pnpm typecheck && pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: player-lab-browser-evidence
          path: |
            playwright-report/
            test-results/
            artifacts/
          retention-days: 7
