name: Format PR branch

on:
  push:
    branches: [feat/coach-assist-localization-ux]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format edited files
        run: pnpm exec prettier --write e2e/enhancements.spec.ts src/lib/http.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- e2e/enhancements.spec.ts src/lib/http.ts; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/enhancements.spec.ts src/lib/http.ts
          git commit -m "style: apply prettier formatting"
          git push origin HEAD:feat/coach-assist-localization-ux
